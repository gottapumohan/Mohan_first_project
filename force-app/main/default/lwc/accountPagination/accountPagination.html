<template>
    <lightning-card title="Account Pagination">

        <lightning-datatable
            key-field="Id"
            data={accounts}
            columns={columns}
            draft-values={draftValues}
            onsave={handleSave}>
        </lightning-datatable>

        <div class="recordCount">
            Showing {startRecord} - {endRecord}
            of {totalRecords} Records
        </div>

        <div class="slds-align_absolute-center slds-p-around_medium">

            <lightning-button
                label="Previous"
                onclick={handlePrevious}
                disabled={disablePrevious}>
            </lightning-button>

            <lightning-button
                label="Next"
                onclick={handleNext}
                disabled={disableNext}
                class="slds-m-left_small">
            </lightning-button>

        </div>

    </lightning-card>
</template>
