<template>

    <lightning-card title="Account Pagination">

        <lightning-datatable
            key-field="Id"
            data={accounts}
            columns={columns}>
        </lightning-datatable>

        <div class="slds-p-around_medium">

            <lightning-button
                label="Previous"
                onclick={handlePrevious}
                disabled={disablePrevious}>
            </lightning-button>

            <lightning-button
                label="Next"
                onclick={handleNext}
                disabled={disableNext}
                class="slds-m-left_small">
            </lightning-button>

        </div>

    </lightning-card>

</template>
