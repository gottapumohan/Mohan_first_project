<template>

    <lightning-card title="Account Dashboard">

        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Loading">
            </lightning-spinner>
        </template>

        <template if:true={account.data}>

            <div class="slds-p-around_medium customerCard">

                <p>
                    <b>Account Name:</b>
                    {accountName}
                </p>

                <p>
                    <b>Phone:</b>
                    {phone}
                </p>

                <p>
                    <b>Industry:</b>
                    {industry}
                </p>

                <p>
                    <b>Revenue:</b>
                    {revenue}
                </p>

                <p>
                    <b>Customer Category:</b>
                    {customerCategory}
                </p>

            </div>

        </template>

        <template if:true={error}>

            <div class="slds-text-color_error slds-p-around_medium">

                Error Loading Account

            </div>

        </template>

    </lightning-card>

</template>
