<template>

    <lightning-card title="Customer Profile">

        <div class="slds-p-around_medium">

            <lightning-record-edit-form

                record-id={recordId}

                object-api-name="Account"

                onsuccess={handleSuccess}

                onerror={handleError}>

                <lightning-messages>
                </lightning-messages>

                <lightning-input-field
                    field-name="Name"
                    required>
                </lightning-input-field>

                <lightning-input-field
                    field-name="Phone">
                </lightning-input-field>

                <lightning-input-field
                    field-name="PersonEmail">
                </lightning-input-field>

                <lightning-input-field
                    field-name="BillingStreet">
                </lightning-input-field>

                <lightning-input-field
                    field-name="BillingCity">
                </lightning-input-field>

                <lightning-input-field
                    field-name="BillingState">
                </lightning-input-field>

                <lightning-input-field
                    field-name="BillingPostalCode">
                </lightning-input-field>

                <br/>

                <lightning-button
                    type="submit"
                    variant="brand"
                    label="Saved">
                </lightning-button>

            </lightning-record-edit-form>

        </div>

    </lightning-card>

</template>
